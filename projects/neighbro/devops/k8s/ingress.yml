apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${STACK_NAME}-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${STACK_NAME}-web
                port:
                  number: 3000
