apiVersion: v1
kind: Secret
metadata:
  name: ${STACK_NAME}-db-secret
stringData:
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${STACK_NAME}-db:5432/${POSTGRES_DB}

---

apiVersion: v1
kind: Secret
metadata:
  name: ${STACK_NAME}-app-secret
stringData:
  JWT_SECRET: ${JWT_SECRET}
